  e.preventDefault();const pw=document.getElementById('pw').value,m=document.getElementById('msg'),keep=document.getElementById('keep').checked;
  m.style.color='';m.textContent='여는 중…';
  try{await open_(pw);try{sessionStorage.setItem(K,pw);if(keep)localStorage.setItem(K,pw)}catch(_){}}
  catch(_){m.style.color='#c0392b';m.textContent='비밀번호가 맞지 않습니다';}
};
(async()=>{let s=null;try{s=sessionStorage.getItem(K)||localStorage.getItem(K)}catch(_){}if(s){try{await open_(s)}catch(_){try{localStorage.removeItem(K)}catch(__){}}}})();
</script></body></html>
